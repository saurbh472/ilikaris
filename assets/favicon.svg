<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
    <defs>
        <linearGradient id="favTop" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="100%" stop-color="#0066ff" />
        </linearGradient>
        <linearGradient id="favMid" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00a2ff" />
            <stop offset="100%" stop-color="#6366f1" />
        </linearGradient>
        <linearGradient id="favBot" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4f46e5" />
            <stop offset="100%" stop-color="#8b5cf6" />
        </linearGradient>
        <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge>
                <feMergeNode in="blur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Dark rounded background container -->
    <rect width="100" height="100" rx="22" fill="#060818" />
    <rect width="98" height="98" x="1" y="1" rx="21" fill="none" stroke="rgba(0, 212, 255, 0.3)" stroke-width="1.5" />

    <!-- Official Logo Shape -->
    <g transform="translate(0, 2)" filter="url(#favGlow)">
        <!-- Top Diamond -->
        <polygon points="44,12 55,17 51,30 40,26" fill="url(#favTop)" />
        <!-- Middle Slanted Bar -->
        <polygon points="40,36 69,31 70,44 22,49" fill="url(#favMid)" />
        <!-- Bottom Folded Ribbon -->
        <polygon points="6,71 83,53 84,63 44,74 59,81 93,81 57,94 6,71" fill="url(#favBot)" />
    </g>
</svg>
